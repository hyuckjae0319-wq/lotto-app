name: 🎱 로또 데이터 자동 업데이트

on:
  schedule:
    # 매주 토요일 KST 23:00 = UTC 14:00
    - cron: '0 14 * * 6'
  workflow_dispatch:  # 수동 실행 허용

jobs:
  update-lotto-data:
    name: 최신 로또 당첨번호 수집
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: 📥 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 🟢 Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🎱 로또 데이터 수집
        run: node scripts/fetch-lotto.js

      - name: 📊 데이터 변경 확인
        id: check_changes
        run: |
          git diff --quiet data/lotto_history.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 💾 변경 사항 커밋 & 푸시
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ROUND=$(node -e "const d=require('./data/lotto_history.json');const draws=d.draws;console.log(draws[draws.length-1].round)")
          git add data/lotto_history.json
          git commit -m "🎱 로또 데이터 업데이트 - 제${ROUND}회 [자동]"
          git push

      - name: ✅ 업데이트 완료 알림
        if: steps.check_changes.outputs.changed == 'true'
        run: echo "✅ 로또 데이터 업데이트 완료!"

      - name: ℹ️ 변경 없음
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "ℹ️ 새로운 당첨번호 없음 (아직 추첨 전이거나 최신 상태)"
